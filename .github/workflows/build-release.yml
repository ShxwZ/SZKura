name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main releases; cancel superseded PR runs so only the latest
# reviewed commit consumes Windows/Linux build resources.
concurrency:
  group: szkura-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Allocate next SZKura prerelease version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Select next unused numeric tag
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Include tags made in GitHub's release UI, not just Actions runs.
          refs="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v0.1.0-alpha." --paginate --jq '.[].ref')"
          max=10000
          while IFS= read -r ref; do
            if [[ "$ref" =~ ^refs/tags/v0[.]1[.]0-alpha[.]([0-9]+)$ ]]; then
              candidate="${BASH_REMATCH[1]}"
              number=$((10#$candidate))
              if (( number > max )); then max=$number; fi
            fi
          done <<< "$refs"
          tag="v0.1.0-alpha.$((max + 1))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building and publishing **$tag**" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: version
    name: Rust test + release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Unit and integration tests
        run: cargo test --all-targets
      - name: Full optimized binary compilation
        env:
          SZKURA_BUILD_TAG: ${{ needs.version.outputs.tag }}
        run: cargo build --release
      - name: Windows executable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SZKura-win-x64
          path: target/release/szkura.exe
          if-no-files-found: error
      - name: Linux executable artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SZKura-linux-x64
          path: target/release/szkura
          if-no-files-found: error

  release:
    name: Publish SZKura Windows + Linux prerelease
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [version, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SZKura-win-x64
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: SZKura-linux-x64
          path: dist/linux
      - name: Publish tested binaries for both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          test -s dist/windows/szkura.exe
          test -s dist/linux/szkura
          cat > release-notes.md <<'SZKURA_NOTES'
          ## SZKura alpha

          **Novedades**
          - Compartir una ficha y sus archivos temporalmente con otra instalación compatible de SZKura mediante HTTPS y Cloudflare Quick Tunnel.
          - Función opcional y desactivada por defecto. El túnel solo se descarga tras consentimiento explícito y se verifica con SHA-256.
          - Enlaces temporales con caducidad, límites de descarga y contraseña opcional. La importación requiere SZKura: no hay página ni descarga desde navegador.
          - Solo una ficha activa a la vez; la cabecera permite identificarla, abrirla o dejar de compartir directamente.
          - Interfaz ES/EN, mejoras de arranque y diagnóstico, y ejecutables Windows x64 / Linux x64 validados en CI.

          **Importante:** Respeta las licencias de los creadores. Los Quick Tunnels de Cloudflare son experimentales y no garantizan disponibilidad ni reanudación de descargas. Comparte el enlace completo solo con personas de confianza.
          SZKURA_NOTES
          gh release create "$tag" \
            "dist/windows/szkura.exe#SZKura-win-x64.exe" \
            "dist/linux/szkura#SZKura-linux-x64" \
            --repo "${{ github.repository }}" --prerelease \
            --target "${{ github.sha }}" --title "SZKura $tag" \
            --notes-file release-notes.md
